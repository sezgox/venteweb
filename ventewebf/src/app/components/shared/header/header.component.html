<header class="app-header">
  <div class="app-header__inner">
    <div class="app-header__brand" routerLink="/events">
      <span class="app-header__brand-mark">V</span>
      <div>
        <span class="app-header__brand-name">Vente</span>
        <p class="app-header__brand-copy">Eventos, comunidad y gestión en un mismo sitio.</p>
      </div>
    </div>

    <div class="app-header__actions">
      @if(loggedIn){
        <button class="app-header__icon-button" aria-label="Social alerts" (click)="goToSocial()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 14h5" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20l-3.2-2H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3Z" />
          </svg>
          @if(notificationsNotRead){
            <span class="app-header__dot"></span>
          }
        </button>
      }

      @if(activeTheme === 'dark') {
        <button class="app-header__icon-button" (click)="toggleTheme()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364l-1.414-1.414M6.05 6.05L4.636 4.636m12.728 0l-1.414 1.414M6.05 17.95l-1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
        </button>
      } @else {
        <button class="app-header__icon-button" (click)="toggleTheme()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-text" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
          </svg>
        </button>
      }

      @if(loggedIn){
        <div (mouseenter)="showMenu()" (mouseleave)="hideMenu()" class="app-header__menu-wrapper">
          <button class="app-header__profile-button" aria-label="Perfil de usuario" style="anchor-name: --menu-btn;">
            <img [src]="user?.photo ?? pfp" alt="Usuario" class="app-header__avatar">
          </button>
          <div id="menu" popover anchor="menu-btn" style="inset:unset; top: anchor(--menu-btn bottom); right: anchor(--menu-btn right);" class="app-header__menu">
            <div class="app-header__menu-list">
              <button class="app-header__menu-item" routerLink="/events/dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7H3v12a2 2 0 002 2z" />
                </svg>
                <span>My Events</span>
              </button>
              <button class="app-header__menu-item" [routerLink]="['/events/social']" [queryParams]="{ section: 'notifications' }">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 14h5" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 20l-3.2-2H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3Z" />
                </svg>
                <span>Social</span>
              </button>
              <button class="app-header__menu-item" routerLink="/user/{{user?.username}}">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a4 4 0 10-8 0 4 4 0 008 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 21v-2a4 4 0 00-4-4H9a4 4 0 00-4 4v2" />
                </svg>
                <span>My Profile</span>
              </button>
              <button class="app-header__menu-item" (click)="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 19v1a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2h4a2 2 0 012 2v1" />
                </svg>
                <span>Log out</span>
              </button>
            </div>
          </div>
        </div>
      } @else {
        <button class="app-header__signin" (click)="signIn()">Sign in</button>
      }
    </div>
  </div>
</header>

@if(loggedIn){
  <button class="app-header__fab" (click)="showModalEventForm = true" aria-label="Create event">
    <svg width="34px" height="34px" viewBox="0 0 20.00 20.00" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="white" stroke-width="0.0002"><g id="SVGRepo_iconCarrier"> <path d="M5 11C4.44772 11 4 10.5523 4 10C4 9.44772 4.44772 9 5 9H15C15.5523 9 16 9.44772 16 10C16 10.5523 15.5523 11 15 11H5Z" fill="white"></path> <path d="M9 5C9 4.44772 9.44772 4 10 4C10.5523 4 11 4.44772 11 5V15C11 15.5523 10.5523 16 10 16C9.44772 16 9 15.5523 9 15V5Z" fill="white"></path> </g></svg>
  </button>
}

@if(showModalEventForm){
  <app-event-form (close)="showModalEventForm = false" (eventCreated)="redirectToEvent($event)"></app-event-form>
}
